# Standalone dev deployment: use this file alone, not merged with production.
services:
  nginx:
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    depends_on: [react-ui]
    env_file: [.env]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${FTEMPO_STATIC_LINKS_DIR}/jpg:/srv/jpg:ro
      - ${FTEMPO_STORAGE_DIR}:/mnt/storage:ro
  react-ui:
    build: .
    command: npm start
    restart: unless-stopped
    depends_on: [solr]
    environment:
      NODE_ENV: production
      FTEMPO_CONFIG: config/dev_solr10_config.json
    volumes:
      - ${FTEMPO_STORAGE_DIR}:/storage:ro
      - type: bind
        source: ${FTEMPO_DEV_INDEX_DIR:?Set the dev-only directory containing updated index JSON files}
        target: /dev-indexes
        read_only: true
        bind:
          create_host_path: false
      - logs:/app/logs
    networks:
      default:
        aliases: [ftempo]
  solr:
    image: solr:10.1.0
    command: solr-precreate ftempo /solrconfig/ftempo
    restart: unless-stopped
    environment:
      SOLR_HEAP: 4g
    volumes:
      - ./solr/cores:/solrconfig:ro
      - type: bind
        source: ${FTEMPO_DEV_SOLR_DATA_DIR:?Set the validated dev-only Solr 10 snapshot directory}
        target: /var/solr
        bind:
          create_host_path: false
volumes:
  logs:
