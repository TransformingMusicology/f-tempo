# Standalone production configuration: docker compose -f compose.prod.yaml up -d --build
volumes:
  logs:

services:
  nginx:
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    depends_on:
      - ftempo
    env_file:
      - .env
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${FTEMPO_STATIC_LINKS_DIR}/jpg:/srv/jpg:ro
      - ${FTEMPO_STORAGE_DIR}:/mnt/storage:ro
  ftempo:
    build: .
    command: npm start
    restart: unless-stopped
    environment:
      NODE_ENV: production
      FTEMPO_CONFIG: config/production_config.json
    volumes:
      - ${FTEMPO_STORAGE_DIR}:/storage:ro
      - logs:/app/logs
    depends_on:
      - solr
  solr:
    image: solr:9.11.0
    restart: unless-stopped
    command: solr-precreate ftempo /solrconfig/ftempo
    volumes:
      - ./solr/cores:/solrconfig:ro
      - ${FTEMPO_SOLR_DATA_DIR}:/var/solr
